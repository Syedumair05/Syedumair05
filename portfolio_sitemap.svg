    <text x="68" y="44" font-size="13" font-weight="800" fill="#0369a1" text-anchor="middle">Projects</text>
    <line x1="16" y1="53" x2="120" y2="53" stroke="#7dd3fc" stroke-width="1" />
    <text x="68" y="70" font-size="10.5" font-weight="600" fill="#0284c7" text-anchor="middle">Practical AI, ML &amp;</text>
    <text x="68" y="83" font-size="10.5" font-weight="600" fill="#0284c7" text-anchor="middle">Software Work</text>
  </g>

  <!-- CARD 6: EDUCATION -->
  <g transform="translate(714, 376)">
    <rect x="0" y="0" width="136" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-sm)" />
    <path d="M 0 8 Q 0 0 8 0 L 128 0 Q 136 0 136 8 L 136 22 L 0 22 Z" fill="#f1f5f9" />
    <text x="10" y="15" font-size="10" font-weight="700" fill="#475569">PAGE 06</text>
    <text x="68" y="44" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Education</text>
    <line x1="16" y1="53" x2="120" y2="53" stroke="#e2e8f0" stroke-width="1" />
    <text x="68" y="70" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">CS Engineering</text>
    <text x="68" y="83" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">Degree Coursework</text>
