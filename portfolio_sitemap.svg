      <line x1="16" y1="82" x2="16" y2="182" stroke="#2563eb" stroke-width="4" />
      <text x="28" y="112" font-size="12" font-weight="600" fill="#1e293b">“I am a Computer Science</text>
      <text x="28" y="132" font-size="12" font-weight="600" fill="#1e293b">Engineering student who builds</text>
      <text x="28" y="152" font-size="12" font-weight="600" fill="#1e293b">practical AI, ML, and full-stack</text>
      <text x="28" y="172" font-size="12" font-weight="600" fill="#1e293b">software projects.”</text>
    </g>

