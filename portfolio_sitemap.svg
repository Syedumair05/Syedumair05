    <line x1="16" y1="53" x2="120" y2="53" stroke="#86efac" stroke-width="1" />
    <text x="68" y="70" font-size="10.5" font-weight="700" fill="#16a34a" text-anchor="middle">Primary Action</text>
    <text x="68" y="83" font-size="10.5" font-weight="500" fill="#15803d" text-anchor="middle">Internship Inquiry</text>
  </g>

  <!-- CARD 9: RESUME -->
  <g transform="translate(1218, 376)">
    <rect x="0" y="0" width="136" height="96" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow-sm)" />
    <path d="M 0 8 Q 0 0 8 0 L 128 0 Q 136 0 136 8 L 136 22 L 0 22 Z" fill="#fef08a" />
    <text x="10" y="15" font-size="10" font-weight="700" fill="#a16207">PAGE 09</text>
    <text x="68" y="44" font-size="13" font-weight="700" fill="#713f12" text-anchor="middle">Resume</text>
