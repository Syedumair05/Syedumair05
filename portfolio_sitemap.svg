      <text x="28" y="112" font-size="12" font-weight="600" fill="#334155">Demonstrate technical skills</text>
      <text x="28" y="132" font-size="12" font-weight="600" fill="#334155">through practical projects,</text>
      <text x="28" y="152" font-size="12" font-weight="600" fill="#334155">work experience, and core</text>
      <text x="28" y="172" font-size="12" font-weight="600" fill="#334155">CS engineering achievements.</text>
    </g>

    <!-- FLOW ARROW 2 -->
    <g transform="translate(825, 160)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
      <rect x="6" y="-22" width="48" height="16" rx="4" fill="#dcfce7" />
      <text x="30" y="-10" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">DRIVES</text>
