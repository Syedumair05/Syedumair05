      <rect x="0" y="0" width="340" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="16" y="16" width="170" height="22" rx="4" fill="#f1f5f9" />
      <text x="24" y="31" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">2. EVIDENCE &amp; PROOF</text>
      
