  <!-- CARD 7: CERTIFICATIONS -->
  <g transform="translate(882, 376)">
    <rect x="0" y="0" width="136" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-sm)" />
    <path d="M 0 8 Q 0 0 8 0 L 128 0 Q 136 0 136 8 L 136 22 L 0 22 Z" fill="#f1f5f9" />
    <text x="10" y="15" font-size="10" font-weight="700" fill="#475569">PAGE 07</text>
    <text x="68" y="44" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Certifications</text>
    <line x1="16" y1="53" x2="120" y2="53" stroke="#e2e8f0" stroke-width="1" />
    <text x="68" y="70" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">Verified Credentials</text>
    <text x="68" y="83" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">&amp; Achievement Badges</text>
  </g>

  <!-- CARD 8: CONTACT (Primary Goal Conversion) -->
  <g transform="translate(1050, 376)">
    <rect x="0" y="0" width="136" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow-sm)" />
    <path d="M 0 8 Q 0 0 8 0 L 128 0 Q 136 0 136 8 L 136 22 L 0 22 Z" fill="#dcfce7" />
