      <rect x="16" y="16" width="160" height="22" rx="4" fill="#dcfce7" />
      <text x="24" y="31" font-size="10" font-weight="700" fill="#15803d" letter-spacing="0.5">3. PRIMARY ACTION</text>
      
      <text x="16" y="68" font-size="13" font-weight="800" fill="#14532d">Target Conversion Goal</text>
      
      <rect x="16" y="82" width="308" height="100" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
      <line x1="16" y1="82" x2="16" y2="182" stroke="#16a34a" stroke-width="4" />
      <text x="28" y="118" font-size="13" font-weight="800" fill="#14532d">“Contact me for internship</text>
