<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Grid pattern for subtle academic architectural backing -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#cbd5e1" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <filter id="shadow-md" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.10" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background Layer -->
  <rect width="1400" height="940" fill="#f8fafc" />
  <rect width="1400" height="940" fill="url(#dot-grid)" opacity="0.7" />

  <!-- Outer Frame / Margin Container -->
  <rect x="24" y="24" width="1352" height="892" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-sm)" />

  <!-- ========================================== -->
  <!-- 1. ACADEMIC HEADER BLOCK                   -->
  <!-- ========================================== -->
  <g transform="translate(60, 50)">
    <!-- Course Tag Badge -->
    <rect x="0" y="0" width="310" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="12" y="16" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.8">ASSIGNMENT: DRAW THE PATH</text>
    <text x="180" y="16" font-size="11" font-weight="500" fill="#3b82f6">• Portfolio Sitemap &amp; Toolkit</text>

    <!-- Main Title -->
    <text x="0" y="56" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Personal Portfolio Sitemap</text>

    <!-- Subtitle -->
    <text x="0" y="78" font-size="14" font-weight="500" fill="#64748b">Existing Portfolio Structure &amp; User Navigation Architecture</text>
  </g>

  <!-- Right Header Metadata Badge -->
  <g transform="translate(1080, 56)">
    <rect x="0" y="0" width="240" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="20" font-size="11" font-weight="700" fill="#475569">DOCUMENT TYPE:</text>
    <text x="120" y="20" font-size="11" font-weight="600" fill="#0f172a">Academic Sitemap</text>
    <text x="16" y="36" font-size="11" font-weight="700" fill="#475569">TOTAL SECTIONS:</text>
    <text x="120" y="36" font-size="11" font-weight="700" fill="#2563eb">9 Existing Pages</text>
  </g>

  <line x1="60" y1="148" x2="1340" y2="148" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ========================================== -->
  <!-- 2. SITEMAP HIERARCHY TREE                   -->
  <!-- ========================================== -->

  <!-- Root Level: MY PORTFOLIO -->
  <g transform="translate(700, 172)">
    <rect x="-110" y="0" width="220" height="44" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow-sm)" />
    <text x="0" y="27" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MY PORTFOLIO</text>
  </g>

  <!-- Trunk Line 1: Root to Home -->
  <line x1="700" y1="216" x2="700" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Primary Level: HOME (Index Landing Page) -->
  <g transform="translate(700, 250)">
    <rect x="-130" y="0" width="260" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow-md)" />
    <!-- Top Accent Cap -->
    <path d="M -129 10 Q -129 1 -120 1 L 120 1 Q 129 1 129 10 L 129 14 L -129 14 Z" fill="#eff6ff" />
    <text x="0" y="32" font-size="16" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.5">1. HOME</text>
    <text x="0" y="48" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">Main Landing Page &amp; Central Hub</text>
  </g>

  <!-- Trunk Line 2: Home to Horizontal Distribution Bus -->
  <line x1="700" y1="308" x2="700" y2="345" stroke="#64748b" stroke-width="2" />
  <circle cx="700" cy="345" r="4" fill="#2563eb" />

  <!-- Horizontal Navigation Bus Line -->
  <!-- Connects X = 110 (About) to X = 1290 (Resume) -->
  <line x1="110" y1="345" x2="1290" y2="345" stroke="#64748b" stroke-width="2" />

  <!-- Drop Lines from Bus Line to 8 Navigation Section Cards -->
  <line x1="110" y1="345" x2="110" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="278" y1="345" x2="278" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="446" y1="345" x2="446" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="614" y1="345" x2="614" y2="375" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="782" y1="345" x2="782" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="950" y1="345" x2="950" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1118" y1="345" x2="1118" y2="375" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <line x1="1286" y1="345" x2="1286" y2="375" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)" />


